name: Build LED Control packages

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-ledcontrol.yml'
      - 'package/ledcontrol/**'
      - 'scripts/ledcontrol/**'
  pull_request:
    paths:
      - '.github/workflows/build-ledcontrol.yml'
      - 'package/ledcontrol/**'
      - 'scripts/ledcontrol/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledcontrol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OpenWrt ${{ matrix.release }} ${{ matrix.package_format }} packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '25.12'
            openwrt_ref: openwrt-25.12
            package_format: APK
            package_extension: apk
          - release: '24.10'
            openwrt_ref: openwrt-24.10
            package_format: IPK
            package_extension: ipk
          - release: '23.05'
            openwrt_ref: openwrt-23.05
            package_format: IPK
            package_extension: ipk
    env:
      OPENWRT_DIR: ${{ github.workspace }}/openwrt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential bison busybox clang flex g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 rsync unzip \
            wget zlib1g-dev

      - name: Validate POSIX shell sources
        run: |
          busybox ash -n scripts/ledcontrol/install.sh
          busybox ash -n scripts/ledcontrol/install-package.sh
          busybox ash -n scripts/ledcontrol/ledcontrol.sh
          busybox ash -n scripts/ledcontrol/lib/generate-led-config.sh
          busybox ash -n scripts/ledcontrol/init.d/ledcontrol
          busybox ash -n package/ledcontrol/files/migrate-legacy

      - name: Fetch OpenWrt buildroot
        run: |
          git clone --depth=1 --branch "${{ matrix.openwrt_ref }}" \
            https://github.com/openwrt/openwrt.git "$OPENWRT_DIR"
          printf '%s\n' "src-link ledcontrol $GITHUB_WORKSPACE" >> "$OPENWRT_DIR/feeds.conf.default"
          cd "$OPENWRT_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build packages
        run: |
          cd "$OPENWRT_DIR"
          make defconfig
          make tools/install
          make toolchain/install
          make package/ledcontrol/{clean,compile} V=s

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          while IFS= read -r package; do
            filename=$(basename "$package")
            cp "$package" "$GITHUB_WORKSPACE/artifacts/${filename%.${{ matrix.package_extension }}}-openwrt-${{ matrix.release }}.${{ matrix.package_extension }}"
          done < <(find "$OPENWRT_DIR/bin/packages" -type f -name '*ledcontrol*.${{ matrix.package_extension }}')
          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -name '*.${{ matrix.package_extension }}' -print -quit)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ledcontrol-openwrt-${{ matrix.release }}-${{ matrix.package_extension }}
          path: artifacts/*.${{ matrix.package_extension }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v5
        with:
          path: packages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          find packages -type f \( -name '*.apk' -o -name '*.ipk' \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          gh release create "$TAG" release-assets/* --generate-notes
